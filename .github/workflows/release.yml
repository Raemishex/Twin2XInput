name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Twin2XInput (x64)
        shell: cmd
        run: build.bat

      - name: Package release archive
        shell: pwsh
        run: |
          $tag = if ($env:GITHUB_REF_NAME -like 'v*') { $env:GITHUB_REF_NAME } else { 'dev' }
          $zip = "Twin2XInput-$tag-win64.zip"
          Compress-Archive -Path dist\* -DestinationPath $zip -Force
          Write-Output "ZIP_NAME=$zip" >> $env:GITHUB_ENV

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ZIP_NAME }}

