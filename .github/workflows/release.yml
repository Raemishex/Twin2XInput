name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7

      - name: Verify vigemclient.dll integrity
        shell: pwsh
        run: |
          $expected = 'E024FA8D2B0AE2262DD1B33170BF66735EBC721541666CFB421ED8B63D985805'
          $actual = (Get-FileHash vendor\vigemclient.dll -Algorithm SHA256).Hash
          if ($actual -ne $expected) {
            Write-Error "vigemclient.dll hash mismatch! Expected: $expected, Got: $actual"
            exit 1
          }
          Write-Output "vigemclient.dll integrity verified: $actual"

      - name: Build Twin2XInput (x64)
        shell: cmd
        run: build.bat

      - name: Upload build artifact
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: twin2xinput-dist
          path: dist/

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: twin2xinput-dist
          path: dist/

      - name: Package release archive
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          zip="Twin2XInput-${tag}-win64.zip"
          cd dist && zip -r "../${zip}" . && cd ..
          echo "ZIP_NAME=${zip}" >> "$GITHUB_ENV"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: ${{ env.ZIP_NAME }}
